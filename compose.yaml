# Local run: `docker compose up --build`, then open http://localhost:8000/docs
name: cloud-labs

services:
  db:
    image: postgres:17.12-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-blog}
    volumes:
      # Named volume: data lives outside the container and survives `docker compose down`.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No "ports:" on purpose: the database is reachable only from the app
    # over the internal compose network (service name "db"), not from the host.

  redis:
    image: redis:7.4.12-alpine
    # Pure cache: no persistence, bounded memory, least-recently-used eviction.
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      --save "" --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-blog}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-blog}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-30}
    ports:
      - "8000:8000"
    depends_on:
      db:
        # Wait until Postgres passes its healthcheck, not just until the container starts.
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
